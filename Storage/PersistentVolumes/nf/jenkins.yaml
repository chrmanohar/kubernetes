apiVersion: apps/v1
kind: Deployment 
metadata:
  name: jenkins-master
  labels:
    app: cicd-master
    environment: production
spec:
  selector:
    matchLabels:
      app: cicd-master
      environment: production
  template:
    metadata:
      name: jenkins-demo
      labels: 
        app: cicd-master
        environment: production
    spec:
      containers:
      - name: cicd-master
        image: jenkins/jenkins:lts
        ports:
          - name: cicd-port
            containerPort: 8080
            protocol: TCP
        volumeMounts:
          - name: jenkins-data
            mountPath: /var/jenkins_home #/var/lib/jenkins
      volumes:
       - name: jenkins-data
         persistentVolumeClaim:
          claimName: jenkins-pvc


