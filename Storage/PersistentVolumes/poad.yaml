apiVersion: v1
kind: Pod
metadata:
  name: nginx-demo
  labels:
   type: webapp
   environment: dev
spec:
  containers:
  - name: nginx
    image: nginx
    ports:
      - containerPort: 80
        hostPort: 8090
    volumeMount:
      - name: nginx-data
        mountPath: "/usr/share/nginx/html"
  volume:
    - name: nginx-data
      PersistentVolumeClaim:
        claimName: nginx-pvc
