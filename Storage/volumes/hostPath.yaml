apiVersion: v1
kind: Pod 
metadata:
  name: nginx-demo
  lables:
    app: nginx
    environment: dev 
spec:
  containers:
  - name: write-container
    image: alpine
    command: ["/bin/sh"]
    args: ["-c", "while true;do date >> /var/log/index.html; sleep:10;done"]
    volumeMount:
    - name : shared-data
      mountPath: /var/log
  - name: nginx-container
    image: nginx
    ports:
      - containerPort: 80
    volumeMount:
      - name: shared-data
        mountPath: /usr/share/nginx/html
  volumes:
    - name: shared-data
      hostPath:
        path: /var/tmp/host-path
        type: DirectoryOrCreate
      

