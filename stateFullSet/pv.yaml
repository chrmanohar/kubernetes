apiVersion: v1
kind: PersistentVolume
metadata:
  name: nginx-pv-01
  lables:
    type: hostpath
    environment: dev
spec:
  storageClassName: hostpath 
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/var/tmp/nginx-data01"

